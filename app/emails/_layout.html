<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>{{ titulo }}</title>
</head>
<body style="margin:0;padding:0;background:#04070d;">
<!-- Texto de pré-visualização (aparece ao lado do assunto na caixa de entrada) -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#04070d;">{{ preheader }}</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#04070d;">
  <tr><td align="center" style="padding:36px 14px;">

    <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">

      <!-- Topo: marca -->
      <tr><td style="padding:0 6px 22px 6px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
          <td style="vertical-align:middle;"><img src="{{ site }}/static/icon.png" width="36" height="36" alt="" style="display:block;border-radius:10px;border:0;"></td>
          <td style="vertical-align:middle;padding-left:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:-0.01em;color:#e8eef8;">Lucas Rangel <span style="font-weight:500;color:#8fa3c2;">· Área do aluno</span></td>
        </tr></table>
      </td></tr>

      <!-- Cartão principal -->
      <tr><td style="background:#0b1426;border:1px solid #22365c;border-radius:22px;padding:38px 34px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#e8eef8;">
        {% block conteudo %}{% endblock %}
      </td></tr>

      <!-- Rodapé -->
      <tr><td style="padding:22px 10px 0 10px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px;line-height:1.6;color:#6f84a6;text-align:center;">
        Rangel Tech · Área do aluno de Lucas Rangel<br>
        Você recebeu este e-mail porque há uma compra ou um pedido de acesso com este endereço.<br>
        Precisa de ajuda? É só responder este e-mail.
      </td></tr>

    </table>

  </td></tr>
</table>
</body>
</html>
