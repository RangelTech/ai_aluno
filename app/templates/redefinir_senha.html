{% extends "base.html" %}
{% block title %}Nova senha{% endblock %}
{% block anon %}
<div class="login"><div class="box">
  <div class="logo"><img src="/static/icon.png" alt="Lucas Rangel"></div>
  <h1 class="center" style="font-size:28px">Criar nova senha</h1>
  <div class="card" style="margin-top:22px">
    {% if erro %}<div class="msg er" role="alert">{{ erro }}</div>{% endif %}
    {% if token %}
    <form method="post" action="/redefinir">
      <input type="hidden" name="t" value="{{ token }}">
      <div class="field"><label for="senha">Nova senha (10+ caracteres)</label><input id="senha" name="senha" type="password" minlength="10" required autofocus autocomplete="new-password"></div>
      <div class="field"><label for="confirma">Repita a senha</label><input id="confirma" name="confirma" type="password" minlength="10" required autocomplete="new-password"></div>
      <button class="btn pri" style="width:100%;margin-top:6px" type="submit">Salvar e entrar</button>
    </form>
    {% else %}<a class="btn pri" style="width:100%" href="/esqueci-senha">Pedir um novo link</a>{% endif %}
  </div>
</div></div>
{% endblock %}
